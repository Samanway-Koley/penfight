<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pen Fight">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a6ea5"/>
      <stop offset="55%" stop-color="#2f5f8f"/>
      <stop offset="100%" stop-color="#254a73"/>
    </linearGradient>
    <linearGradient id="penA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d7fb8"/>
      <stop offset="45%" stop-color="#2d5f96"/>
      <stop offset="100%" stop-color="#1f4470"/>
    </linearGradient>
    <linearGradient id="penB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef4f8"/>
      <stop offset="40%" stop-color="#c5d4e0"/>
      <stop offset="100%" stop-color="#8fa4b5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e08a"/>
      <stop offset="55%" stop-color="#d4a93a"/>
      <stop offset="100%" stop-color="#b88928"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="50%" stop-color="#c9d4dc"/>
      <stop offset="100%" stop-color="#7f8f9b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#10233a" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- rounded tray -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#bg)"/>
  <rect x="58" y="58" width="396" height="396" rx="78" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>
  <rect x="84" y="84" width="344" height="344" rx="58" fill="none" stroke="rgba(12,28,48,.18)" stroke-width="18"/>

  <g filter="url(#soft)">
    <!-- left pen: solid blue click pen with gold clip -->
    <g transform="translate(188 78)">
      <rect x="18" y="0" width="36" height="28" rx="10" fill="url(#steel)"/>
      <rect x="10" y="24" width="52" height="292" rx="26" fill="url(#penA)"/>
      <rect x="18" y="34" width="14" height="250" rx="7" fill="rgba(255,255,255,.16)"/>
      <rect x="42" y="58" width="14" height="118" rx="5" fill="url(#gold)"/>
      <rect x="46" y="62" width="4" height="96" rx="2" fill="rgba(255,255,255,.35)"/>
      <rect x="16" y="248" width="40" height="42" rx="12" fill="#1b3d66"/>
      <path d="M18 288 L28 332 Q36 348 44 332 L54 288 Z" fill="url(#steel)"/>
      <ellipse cx="36" cy="342" rx="7" ry="10" fill="#24313c"/>
      <rect x="22" y="120" width="28" height="8" rx="3" fill="rgba(255,255,255,.12)"/>
      <rect x="22" y="156" width="28" height="8" rx="3" fill="rgba(255,255,255,.1)"/>
    </g>

    <!-- right pen: clear body with silver clip and grip -->
    <g transform="translate(268 70)">
      <rect x="16" y="0" width="40" height="34" rx="12" fill="url(#steel)"/>
      <rect x="20" y="8" width="32" height="12" rx="6" fill="#eef3f7"/>
      <rect x="12" y="30" width="48" height="296" rx="24" fill="url(#penB)"/>
      <rect x="20" y="46" width="32" height="210" rx="12" fill="rgba(255,255,255,.42)"/>
      <rect x="28" y="78" width="16" height="150" rx="6" fill="#2f4d66" opacity=".55"/>
      <rect x="28" y="86" width="16" height="28" rx="5" fill="#5f7f98" opacity=".55"/>
      <path d="M50 54 C66 58 70 78 66 118 C63 148 58 170 52 188 L48 176 C54 154 58 128 58 104 C58 78 56 62 50 54Z" fill="url(#steel)"/>
      <rect x="16" y="236" width="40" height="54" rx="10" fill="#7d8d99"/>
      <path d="M20 244 H52 M20 252 H52 M20 260 H52 M20 268 H52 M20 276 H52" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round"/>
      <path d="M18 288 L28 336 Q36 352 44 336 L54 288 Z" fill="url(#steel)"/>
      <ellipse cx="36" cy="348" rx="6.5" ry="9" fill="#24313c"/>
    </g>
  </g>
</svg>
